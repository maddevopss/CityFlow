global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: cityflow
    environment: ${CITYFLOW_ENVIRONMENT:-local}

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cityflow-backend
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${CITYFLOW_METRICS_TOKEN}
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: cityflow-backend
