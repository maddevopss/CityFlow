openapi: 3.1.0
info:
  title: CityFlow Inspections API
  version: 1.0.0
  description: Contrat API du module municipal Inspections.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Inspections
  - name: Evidence
  - name: Reports
  - name: Notifications
paths:
  /inspections:
    get:
      tags: [Inspections]
      summary: Lister les inspections accessibles
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InspectionStatus' } }
        - { name: inspectionType, in: query, schema: { $ref: '#/components/schemas/InspectionType' } }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: Page d’inspections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Inspections]
      summary: Planifier une inspection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInspection' }
      responses:
        '201':
          description: Inspection créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /inspections/{inspectionId}:
    get:
      tags: [Inspections]
      summary: Consulter une inspection
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      responses:
        '200':
          description: Inspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inspections/{inspectionId}/assign:
    post:
      tags: [Inspections]
      summary: Affecter un inspecteur
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspectorId]
              properties:
                inspectorId: { type: string, format: uuid }
      responses:
        '200': { description: Inspection affectée }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inspections/{inspectionId}/complete:
    post:
      tags: [Inspections]
      summary: Terminer une inspection
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteInspection' }
      responses:
        '200': { description: Inspection terminée }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inspections/{inspectionId}/evidence:
    get:
      tags: [Evidence]
      summary: Lister les preuves
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      responses:
        '200':
          description: Liste des preuves
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectionEvidence' }
    post:
      tags: [Evidence]
      summary: Enregistrer une preuve
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionEvidenceInput' }
      responses:
        '201': { description: Preuve enregistrée }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inspection-reports/{inspectionId}:
    get:
      tags: [Reports]
      summary: Générer le rapport déterministe
      parameters: [{ $ref: '#/components/parameters/InspectionId' }]
      responses:
        '200': { description: Rapport d’inspection }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inspection-notifications/dispatch:
    post:
      tags: [Notifications]
      summary: Préparer ou mettre en file une notification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationDispatch' }
      responses:
        '202': { description: Distribution acceptée }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    InspectionStatus:
      type: string
      enum: [SCHEDULED, COMPLETED, CANCELLED]
    InspectionType:
      type: string
      enum: [PRE_WORK, IN_PROGRESS, FINAL, COMPLAINT]
    InspectionOutcome:
      type: string
      enum: [COMPLIANT, NON_COMPLIANT, FOLLOW_UP_REQUIRED]
    Inspection:
      type: object
      required: [id, municipalityId, scheduledAt, address, inspectionType, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        municipalityId: { type: integer }
        permitId: { type: [string, 'null'], format: uuid }
        assignedTo: { type: [string, 'null'], format: uuid }
        scheduledAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        address: { type: string, maxLength: 300 }
        inspectionType: { $ref: '#/components/schemas/InspectionType' }
        status: { $ref: '#/components/schemas/InspectionStatus' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/InspectionOutcome'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 4000 }
        findings: { type: [string, 'null'], maxLength: 8000 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InspectionPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Inspection' }
        pagination:
          type: object
          required: [page, pageSize, total, totalPages, hasNextPage, hasPreviousPage]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
            hasNextPage: { type: boolean }
            hasPreviousPage: { type: boolean }
    CreateInspection:
      type: object
      required: [scheduledAt, address, inspectionType]
      properties:
        permitId: { type: [string, 'null'], format: uuid }
        scheduledAt: { type: string, format: date-time }
        address: { type: string, minLength: 3, maxLength: 300 }
        inspectionType: { $ref: '#/components/schemas/InspectionType' }
        notes: { type: [string, 'null'], maxLength: 4000 }
    CompleteInspection:
      type: object
      required: [outcome, findings]
      properties:
        outcome: { $ref: '#/components/schemas/InspectionOutcome' }
        findings: { type: string, minLength: 3, maxLength: 8000 }
        completedAt: { type: string, format: date-time }
    InspectionEvidenceInput:
      type: object
      required: [evidenceType, fileName, mimeType, sizeBytes, storageKey, sha256, capturedAt]
      properties:
        evidenceType: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        storageKey: { type: string }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        description: { type: [string, 'null'] }
        capturedAt: { type: string, format: date-time }
    InspectionEvidence:
      allOf:
        - $ref: '#/components/schemas/InspectionEvidenceInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            inspectionId: { type: string, format: uuid }
            uploadedBy: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    NotificationDispatch:
      type: object
      required: [inspectionId, channel, recipient, template, mode]
      properties:
        inspectionId: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, SMS, PUSH] }
        recipient: { type: string }
        template: { type: string }
        mode: { type: string, enum: [PREVIEW, QUEUE] }
    Error:
      type: object
      required: [message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    BadRequest:
      description: Requête invalide
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentification requise
    NotFound:
      description: Ressource introuvable ou inaccessible
    Conflict:
      description: Transition ou doublon incompatible
    TooManyRequests:
      description: Quota dépassé
      headers:
        Retry-After: { schema: { type: integer } }
