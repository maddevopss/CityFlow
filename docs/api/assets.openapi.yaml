openapi: 3.1.0
info: { title: CityFlow Assets API, version: 1.0.0 }
servers: [{ url: /api/v1 }]
security: [{ bearerAuth: [] }]
paths:
  /assets:
    get:
      summary: Lister les actifs municipaux
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: category, schema: { type: string, enum: [PARK, BUILDING, VEHICLE, EQUIPMENT] } }
        - { in: query, name: status, schema: { type: string, enum: [PLANNED, ACTIVE, OUT_OF_SERVICE, DISPOSED] } }
        - { in: query, name: criticality, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { in: query, name: q, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses: { '200': { description: Liste paginée }, '400': { description: Filtres invalides } }
    post:
      summary: Créer un actif
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAsset' }
      responses: { '201': { description: Actif créé }, '400': { description: Entrée ou parent invalide } }
  /assets/{id}:
    get:
      summary: Consulter un actif et son historique
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Actif }, '404': { description: Introuvable } }
  /assets/{id}/assessments:
    post:
      summary: Ajouter une évaluation de condition
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condition, score]
              properties:
                condition: { type: string, enum: [EXCELLENT, GOOD, FAIR, POOR, CRITICAL] }
                score: { type: integer, minimum: 0, maximum: 100 }
                notes: { type: [string, 'null'], maxLength: 4000 }
      responses: { '201': { description: Évaluation créée }, '404': { description: Actif introuvable } }
  /assets/{id}/status:
    post:
      summary: Changer l’état d’un actif
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [PLANNED, ACTIVE, OUT_OF_SERVICE, DISPOSED] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses: { '200': { description: État modifié }, '409': { description: Actif disposé } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    CreateAsset:
      type: object
      required: [publicCode, name, category]
      properties:
        publicCode: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, enum: [PARK, BUILDING, VEHICLE, EQUIPMENT] }
        status: { type: string, enum: [PLANNED, ACTIVE, OUT_OF_SERVICE, DISPOSED], default: PLANNED }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
        parentId: { type: [string, 'null'], format: uuid }
