openapi: 3.1.0
info:
  title: CityFlow Citizen Reports API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /citizen-reports/public:
    post:
      summary: Créer un signalement public
      responses:
        '201': { description: Signalement créé }
        '400': { description: Requête invalide }
        '429': { description: Limite atteinte }
  /citizen-reports/public/{publicNumber}:
    get:
      summary: Suivre un signalement public
      parameters:
        - in: path
          name: publicNumber
          required: true
          schema: { type: string }
        - in: header
          name: x-cityflow-tracking-token
          required: true
          schema: { type: string }
      responses:
        '200': { description: État public }
        '404': { description: Introuvable }
  /citizen-reports:
    get:
      summary: Lister la file municipale
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Liste paginée }
  /citizen-reports/{id}/transition:
    post:
      summary: Faire évoluer le signalement
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Transition appliquée }
        '409': { description: Transition interdite }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
