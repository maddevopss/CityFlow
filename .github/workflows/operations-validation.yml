name: Operations validation

on:
  pull_request:
    paths:
      - 'observability/**'
      - 'ops/**'
      - 'tests/load/**'
      - 'docs/operations/**'
      - '.github/workflows/operations-validation.yml'
  push:
    branches: [main]
    paths:
      - 'observability/**'
      - 'ops/**'
      - 'tests/load/**'
      - 'docs/operations/**'

permissions:
  contents: read

jobs:
  validate-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Prometheus rules
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.5.0
          check rules
          /workspace/observability/prometheus/cityflow-alerts.yml
          /workspace/observability/prometheus/cityflow-recording-rules.yml

      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro"
          --entrypoint /bin/amtool
          prom/alertmanager:v0.28.1
          check-config
          /workspace/observability/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool observability/grafana/dashboards/cityflow-diffusion.json >/dev/null

      - name: Validate available shell scripts
        run: |
          find ops -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            bash -n "$script"
          done

      - name: Reject committed secrets
        run: |
          paths=()
          for path in observability ops docs/operations tests/load; do
            [[ -e "$path" ]] && paths+=("$path")
          done
          if grep -RInE '(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|hooks\.slack\.com/services/|sk_live_)' "${paths[@]}"; then
            echo 'Potential secret committed in operations files.' >&2
            exit 1
          fi
