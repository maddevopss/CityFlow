name: Support maintenance contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'NODE'
          const c=require('./config/support-maintenance-contract.json');
          if(c.productLine!=='1.x'||c.supportWindowDays<365||c.criticalResponseMinutes>30||c.securityPatchTargetDays>7||!c.breakingChangesForbidden||!c.releaseGateRequired||c.allowedChangeTypes.length<4) process.exit(1);
          console.log('Support and maintenance contract valid');
          NODE
