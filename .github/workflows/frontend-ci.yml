name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          git diff --name-only --diff-filter=ACMRT "$base_sha" "$head_sha" -- ../frontend/src \
            | grep -E '\.(css|js|jsx|json|md|ts|tsx)$' \
            | sed 's#^frontend/##' \
            > /tmp/prettier-files.txt || true

          if [[ ! -s /tmp/prettier-files.txt ]]; then
            echo "Aucun fichier frontend compatible avec Prettier n’a été modifié."
            exit 0
          fi

          echo "Fichiers vérifiés par Prettier :"
          cat /tmp/prettier-files.txt
          xargs --no-run-if-empty npx prettier --check < /tmp/prettier-files.txt

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test -- --run --passWithNoTests
