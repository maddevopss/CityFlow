name: Checklist library

on:
  pull_request:
    paths:
      - 'docs/checklists/**'
      - 'scripts/validate-checklist-library.mjs'
      - '.github/workflows/checklist-library.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/checklists/**'
      - 'scripts/validate-checklist-library.mjs'
      - '.github/workflows/checklist-library.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate checklists C1-C20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate checklist library
        run: node scripts/validate-checklist-library.mjs
