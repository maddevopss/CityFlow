name: Disaster recovery plan
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const p=require('./config/disaster-recovery.json'); if(!p.recoveryOrder?.includes('postgres')||p.objectives.rtoMinutes<=0||p.exerciseFrequencyDays>90) process.exit(1)"
