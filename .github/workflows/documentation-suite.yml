name: Documentation suite

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/generate-governance-document.mjs'
      - 'scripts/test-document-generator.mjs'
      - 'scripts/scaffold-feature.mjs'
      - 'scripts/test-feature-scaffold.mjs'
      - '.github/workflows/documentation-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-*.mjs'
      - 'scripts/generate-governance-document.mjs'
      - 'scripts/test-document-generator.mjs'
      - 'scripts/scaffold-feature.mjs'
      - 'scripts/test-feature-scaffold.mjs'
      - '.github/workflows/documentation-suite.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate documentation suite
        run: node scripts/validate-documentation-suite.mjs

      - name: Test document generator safeguards
        run: node scripts/test-document-generator.mjs

      - name: Test feature scaffold safeguards
        run: node scripts/test-feature-scaffold.mjs

      - name: Exercise all document generators
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-documentation-suite
          for type in decision adr incident validation deploiement audit rapport communication; do
            node scripts/generate-governance-document.mjs \
              --type "$type" \
              --id "TEST-${type^^}" \
              --title "Validation du modèle $type" \
              --owner "CI CityFlow" \
              --date "2026-07-31" \
              --output ".tmp-documentation-suite/$type.md"
          done
          test "$(find .tmp-documentation-suite -type f -name '*.md' | wc -l)" -eq 8
          if grep -R '{{[A-Z0-9_]*}}' .tmp-documentation-suite; then
            echo 'Variables non remplacées détectées.' >&2
            exit 1
          fi
          rm -rf .tmp-documentation-suite

      - name: Exercise guided feature generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/feature-work/ci-guided-feature
          node scripts/scaffold-feature.mjs \
            --title "Fonctionnalité guidée CI" \
            --slug "ci-guided-feature" \
            --owner "CI CityFlow" \
            --objective "Vérifier le dossier fonctionnel guidé en intégration continue." \
            --output "docs/feature-work/ci-guided-feature"
          node scripts/validate-feature-work.mjs
          rm -rf docs/feature-work/ci-guided-feature
