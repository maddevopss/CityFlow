name: Release calendar
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/release-calendar.json','utf8'));
          if(c.line!=='1.x'||c.regularCadenceDays<14||c.freezeHoursBeforeRelease<12||!c.securityReleaseAllowedAnytime||!c.automaticPublicationForbidden) process.exit(1);
          if(c.requiredGates.length<5) process.exit(1);
          console.log('Release calendar contract valid');
          NODE
