name: Business continuity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node - <<'NODE'
          const p=require('./config/business-continuity.json');
          if(!p.modules?.length) throw new Error('modules missing');
          for(const m of p.modules){ if(!m.name||m.priority<1||m.rtoMinutes<=0||m.rpoMinutes<0) throw new Error(`invalid ${m.name}`); }
          if(!p.modules.some(m=>m.priority===1)) throw new Error('priority 1 missing');
          NODE
