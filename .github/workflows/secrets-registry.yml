name: Secrets registry
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/security/validate-secrets-registry.mjs
      - run: DATABASE_URL=test JWT_SECRET=test node scripts/security/validate-secrets-registry.mjs > secrets-report.json
      - run: grep -q '"registered": 5' secrets-report.json
