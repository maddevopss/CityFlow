name: Frontend Cypress

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cypress.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run preview -- --host 0.0.0.0 > /tmp/cityflow-frontend-preview.log 2>&1 &
      - run: npx cypress run --browser electron
