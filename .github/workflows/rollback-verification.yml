name: Rollback verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --check scripts/release/verify-rollback.mjs
      - env:
          ROLLBACK_TARGET: v0.9.0
          CURRENT_RELEASE: v1.0.0
          CONFIRM_ROLLBACK: ROLLBACK
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/release/verify-rollback.mjs
