name: Permits production E2E

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'docs/api/permits.openapi.yaml'
      - 'docs/modules/permits/**'
      - '.github/workflows/permits-e2e-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permits-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      CITYFLOW_API_URL: ${{ secrets.CITYFLOW_STAGING_API_URL }}
      CITYFLOW_E2E_AGENT_TOKEN: ${{ secrets.CITYFLOW_E2E_AGENT_TOKEN }}
      CITYFLOW_E2E_PERMIT_REVIEWER_TOKEN: ${{ secrets.CITYFLOW_E2E_PERMIT_REVIEWER_TOKEN }}
      CITYFLOW_E2E_OTHER_MUNICIPALITY_TOKEN: ${{ secrets.CITYFLOW_E2E_OTHER_MUNICIPALITY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify staging secrets
        shell: bash
        run: |
          missing=0
          for name in CITYFLOW_API_URL CITYFLOW_E2E_AGENT_TOKEN CITYFLOW_E2E_PERMIT_REVIEWER_TOKEN CITYFLOW_E2E_OTHER_MUNICIPALITY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing staging secret::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run permits production journey
        run: npm run test:permits

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permits-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
