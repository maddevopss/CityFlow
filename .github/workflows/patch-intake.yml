name: Patch intake
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/patch-intake.json','utf8'));
          const required=['bugfix','security','documentation','dependency'];
          if(c.line!=='1.x'||!c.breakingChangesForbidden||!c.productionApprovalRequired) process.exit(1);
          if(required.some(x=>!c.allowedTypes.includes(x))||c.requiredFields.length<6) process.exit(1);
          console.log('Patch intake contract valid');
          NODE
