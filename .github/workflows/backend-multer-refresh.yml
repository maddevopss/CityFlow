name: Backend Multer refresh

on:
  push:
    branches:
      - phase3/security
    paths:
      - '.github/workflows/backend-multer-refresh.yml'
      - 'backend/package.json'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase3/security
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Régénérer le lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Vérifier l’audit et les tests
        run: |
          npm audit --audit-level=high
          npm run prisma:generate
          npm test -- --runInBand
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://cityflow:cityflow@localhost:5432/cityflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-cityflow-at-least-32-characters

      - name: Publier le lockfile vérifié
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(security): régénérer le lockfile après Multer 2.2'
          git push origin HEAD:phase3/security
