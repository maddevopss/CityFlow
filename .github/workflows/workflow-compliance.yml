name: Workflow compliance

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/governance/audit-workflows.mjs'
      - 'docs/operations/GITHUB_ACTIONS_GOVERNANCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit des workflows modifiés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Vérifier la syntaxe du script
        run: node --check scripts/governance/audit-workflows.mjs

      - name: Générer l’inventaire global
        run: node scripts/governance/audit-workflows.mjs > workflow-compliance.json

      - name: Valider strictement les workflows modifiés
        if: github.event_name == 'pull_request'
        env:
          WORKFLOW_AUDIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance/audit-workflows.mjs --changed-only --strict

      - name: Publier la preuve d’audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-compliance
          path: workflow-compliance.json
          if-no-files-found: error
          retention-days: 14
