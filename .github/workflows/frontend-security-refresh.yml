name: Frontend security refresh

on:
  push:
    branches:
      - phase3/security
    paths:
      - '.github/workflows/frontend-security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase3/security
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Mettre à jour les dépendances vulnérables
        run: |
          npm install --save --ignore-scripts --no-audit --no-fund react-router-dom@6.30.4
          npm install --save-dev --ignore-scripts --no-audit --no-fund vite@6.4.3 vitest@3.2.6 cypress@15.19.0

      - name: Vérifier l’audit
        run: npm audit --audit-level=high

      - name: Vérifier la compilation et les tests
        run: |
          npm run build
          npm test -- --run

      - name: Publier le manifeste et le lockfile vérifiés
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(security): mettre à jour les dépendances frontend vulnérables'
          git push origin HEAD:phase3/security
