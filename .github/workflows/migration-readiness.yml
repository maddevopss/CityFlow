    runs-on: ubuntu-24.04
    steps:
      # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --check scripts/release/check-migrations.mjs
      - run: node scripts/release/check-migrations.mjs
