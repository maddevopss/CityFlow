name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/validate-project.mjs'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/validate-project.mjs'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d50004c3c3b5e57dbf46d2f2a38 # v4.0.3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint -- --quiet

      - name: Run tests
        run: npm test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://cityflow:cityflow@localhost:5432/cityflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-cityflow-at-least-32-characters
