name: Quality and compliance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/api/**'
      - 'docs/industrialization/**'
      - '.github/workflows/quality-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate OpenAPI contracts
        run: npx --yes @redocly/cli@1.27.1 lint 'docs/api/*.yaml'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cityflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: quality-compliance-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test -- --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run --passWithNoTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 14
