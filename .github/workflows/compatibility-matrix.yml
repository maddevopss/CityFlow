name: Compatibility matrix
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/compatibility-matrix.json','utf8'));
          if(!c.node.includes('22')||c.postgresql.length<2||!c.apiBackwardCompatibility||!c.databaseForwardOnlyMigrations||c.reviewEveryDays>90) process.exit(1);
          for(const v of Object.values(c.browsers)) if(v<2) process.exit(1);
          console.log('Compatibility matrix valid');
          NODE
