name: Template library

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'scripts/validate-template-library.mjs'
      - '.github/workflows/template-library.yml'
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - 'scripts/validate-template-library.mjs'
      - '.github/workflows/template-library.yml'

permissions:
  contents: read

jobs:
  validate-template-library:
    name: Validate template library
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate A1 to A20
        run: node scripts/validate-template-library.mjs
